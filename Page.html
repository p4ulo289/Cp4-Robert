<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP4 - Grid Layout & Responsividade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container-preto">
        <section class="banner-section">
            <img src="./Images/banner/01.jpg" alt="Banner" class="banner-img">
        </section>

        <section class="cards-grid">
            <div class="card-texto">
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nulla explicabo, quo, modi quod qui atque
                    eaque repellendus est nisi voluptate facere.</p>
                <button class="btn-saiba-mais">Saiba mais</button>
            </div>
            <div class="card-img"><img src="./Images/banner/02.jpg" alt="Grécia 1"></div>
            <div class="card-img"><img src="./Images/banner/03.jpg" alt="Grécia 2"></div>
            <div class="card-img"><img src="./Images/banner/04.jpg" alt="Grécia 3"></div>
        </section>
    </main>

    <section class="galeria-section">
        <div class="galeria-grid">
            <div class="galeria-item"><img src="./Images/sea/01.jpg" alt="Praia"></div>
            <div class="galeria-item grande"><img src="./Images/sea/03.jpg" alt="Praia Longa"></div>
            <div class="galeria-item"><img src="./Images/sea/01.jpg" alt="Praia"></div>
            <div class="galeria-item grande"><img src="./Images/sea/03.jpg" alt="Praia Longa"></div>
            <div class="galeria-item"><img src="./Images/sea/01.jpg" alt="Praia"></div>
            <div class="galeria-item"><img src="./Images/sea/02.jpg" alt="Praia Baixo"></div>
            <div class="galeria-item"><img src="./Images/sea/02.jpg" alt="Praia Baixo"></div>
            <div class="galeria-item"><img src="./Images/sea/02.jpg" alt="Praia Baixo"></div>
        </div>
    </section>

</body>

</html>
